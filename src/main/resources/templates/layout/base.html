<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <title th:replace="${title}">GameVault</title>
    <link rel="stylesheet" th:href="@{/styles/styles.css}">
</head>

<body>
<nav>
    <a th:href="@{/juegos}" class="nav-brand">🎮 GameVault</a>
    <div class="nav-links">
        <a th:href="@{/juegos}">Inicio</a>
        <a th:href="@{/fragments-demo}" style="color: var(--success); margin-left: 20px;">Fragmentos</a>

        <!-- Opciones en caso de que haya sesión activa -->
        <th:block th:if="${sesion?.usuario_id != null}">
            <a th:href="@{/mis-juegos}">Mis juegos</a>
            <a th:href="@{/juegos/nuevo}">Subir Juego</a>
            <a th:href="@{/logout}">Cerrar sesión</a>
        </th:block>

        <!-- Opciones en caso de que no haya sesión activa -->
        <th:block th:if="${sesion?.usuario_id == null}">
            <a th:href="@{/login}">Iniciar sesión</a>
            <a th:href="@{/registro}">Registrarse</a>
        </th:block>
    </div>
</nav>

<main class="container" th:replace="${content}">
    Contenido por defecto...
</main>
</body>
</html>
